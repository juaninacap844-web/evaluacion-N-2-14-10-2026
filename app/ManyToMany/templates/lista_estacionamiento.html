<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>estacionaminento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
    <h2>Lista de estacionaminento</h2>
    <ul>
        {% for estacionaminento in estacionaminentos %}
        <li>
            <strong>{{estacionaminento.direccion}}</strong> ({{estacionaminento.encargado}}) - 
            <a href="{% url 'detalle_estacionamiento' idEstacionamiento %}">informacion</a>
        </li>
        {% empty %}
        <li> No hay estacionaminento registrado</li>
        {% endfor %}
    </ul>
</body>
</html>
